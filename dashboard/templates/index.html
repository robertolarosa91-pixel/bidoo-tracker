<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bidoo Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0a0f; --surface: #111118; --surface2: #18181f;
    --border: #2a2a38; --accent: #f0c040; --accent2: #e05c30;
    --green: #3ddc84; --text: #e8e8f0;
    --font-mono: 'Space Mono', monospace;
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'DM Sans', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; overflow-x: hidden; }
  body::after { content: ''; position: fixed; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px); pointer-events: none; z-index: 999; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 100; }
  .logo { display: flex; align-items: baseline; gap: 10px; }
  .logo h1 { font-family: var(--font-display); font-size: 2.2rem; letter-spacing: 3px; color: var(--accent); line-height: 1; }
  .logo span { font-family: var(--font-mono); font-size: 0.65rem; color: #555570; text-transform: uppercase; letter-spacing: 2px; }
  .header-right { display: flex; align-items: center; gap: 24px; }
  .live-badge { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 0.75rem; color: var(--green); text-transform: uppercase; letter-spacing: 2px; }
  .live-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(61,220,132,0.4); } 50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(61,220,132,0); } }
  .last-update { font-family: var(--font-mono); font-size: 0.7rem; color: #555570; }
  main { padding: 32px 40px; max-width: 1400px; margin: 0 auto; }
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); padding: 24px; position: relative; overflow: hidden; transition: border-color 0.2s; }
  .stat-card:hover { border-color: var(--accent); }
  .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform 0.3s ease; }
  .stat-card:hover::before { transform: scaleX(1); }
  .stat-label { font-family: var(--font-mono); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; color: #555570; margin-bottom: 10px; }
  .stat-value { font-family: var(--font-display); font-size: 3rem; color: var(--accent); line-height: 1; }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--accent2); }
  .stat-sub { font-size: 0.75rem; color: #555570; margin-top: 6px; font-family: var(--font-mono); }
  .content-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px; }
  .panel { background: var(--surface); border: 1px solid var(--border); padding: 24px; }
  .panel-title { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #555570; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
  .panel-title::before { content: ''; display: inline-block; width: 12px; height: 2px; background: var(--accent); }
  .category-bars { display: flex; flex-direction: column; gap: 12px; }
  .cat-row { display: flex; align-items: center; gap: 12px; }
  .cat-name { font-size: 0.8rem; color: var(--text); width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat-bar-wrap { flex: 1; height: 6px; background: var(--surface2); border: 1px solid var(--border); overflow: hidden; }
  .cat-bar { height: 100%; background: var(--accent); transition: width 1s ease; }
  .cat-count { font-family: var(--font-mono); font-size: 0.7rem; color: #555570; width: 30px; text-align: right; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  thead tr { border-bottom: 1px solid var(--border); }
  th { font-family: var(--font-mono); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1.5px; color: #555570; padding: 8px 12px; text-align: left; white-space: nowrap; }
  tbody tr { border-bottom: 1px solid #1a1a24; transition: background 0.15s; }
  tbody tr:hover { background: var(--surface2); }
  td { padding: 10px 12px; vertical-align: middle; }
  .title-cell { max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .price-tag { font-family: var(--font-mono); font-size: 0.85rem; color: var(--accent); font-weight: 700; }
  .savings-pct { font-family: var(--font-mono); font-size: 0.7rem; color: var(--green); }
  .cat-badge { display: inline-block; padding: 2px 8px; border: 1px solid var(--border); font-size: 0.65rem; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 1px; color: #888898; }
  .status-live { display: inline-flex; align-items: center; gap: 5px; color: var(--green); font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700; }
  .status-live::before { content: ''; width: 6px; height: 6px; background: var(--green); border-radius: 50%; animation: pulse 1.5s infinite; }
  .status-timer { font-family: var(--font-mono); font-size: 0.75rem; color: #888898; }
  .bids-count { font-family: var(--font-mono); font-size: 0.75rem; color: var(--accent2); }
  .full-panel { background: var(--surface); border: 1px solid var(--border); padding: 24px; margin-bottom: 32px; }
  .refresh-btn { background: none; border: 1px solid var(--border); color: #555570; font-family: var(--font-mono); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; padding: 6px 14px; cursor: pointer; transition: all 0.2s; margin-left: 12px; }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
  canvas { max-height: 220px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .empty { text-align: center; padding: 48px 0; font-family: var(--font-mono); font-size: 0.75rem; color: #333348; text-transform: uppercase; letter-spacing: 2px; }
  @media (max-width: 900px) { main { padding: 20px; } header { padding: 16px 20px; } .stats-grid { grid-template-columns: repeat(2, 1fr); } .content-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="logo">
    <h1>BIDOO TRACKER</h1>
    <span>v1.0 · live monitor</span>
  </div>
  <div class="header-right">
    <div class="live-badge"><div class="live-dot"></div>Live</div>
    <div class="last-update" id="lastUpdate">--:--:--</div>
    <button class="refresh-btn" onclick="loadAll()">⟳ Aggiorna</button>
  </div>
</header>
<main>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Aste Totali</div><div class="stat-value" id="statTotal">—</div><div class="stat-sub">in questo momento</div></div>
    <div class="stat-card"><div class="stat-label">Aste LIVE</div><div class="stat-value green" id="statLive">—</div><div class="stat-sub">ora attive</div></div>
    <div class="stat-card"><div class="stat-label">Prezzo Medio</div><div class="stat-value" id="statAvg">—</div><div class="stat-sub">euro / asta</div></div>
    <div class="stat-card"><div class="stat-label">Categorie</div><div class="stat-value red" id="statCats">—</div><div class="stat-sub">attive</div></div>
  </div>
  <div class="content-row">
    <div class="panel"><div class="panel-title">Andamento prezzi medi</div><canvas id="priceChart"></canvas></div>
    <div class="panel"><div class="panel-title">Categorie top</div><div class="category-bars" id="catBars"><div class="empty">Caricamento...</div></div></div>
  </div>
  <div class="full-panel">
    <div class="panel-title">Aste in corso</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Prodotto</th><th>Categoria</th><th>Prezzo</th><th>Listino</th><th>Risparmio</th><th>Offerte</th><th>Stato</th><th>Link</th></tr></thead>
        <tbody id="auctionsTable"><tr><td colspan="8" class="empty">Caricamento...</td></tr></tbody>
      </table>
    </div>
  </div>
</main>
<script>
let priceChart = null;
async function loadStats() {
  const res = await fetch('/api/stats');
  const s = await res.json();
  document.getElementById('statTotal').textContent = s.total || '0';
  document.getElementById('statLive').textContent = s.live || '0';
  document.getElementById('statAvg').textContent = s.avg_price ? '€' + s.avg_price : '—';
  document.getElementById('statCats').textContent = s.categories ? s.categories.length : '0';
  document.getElementById('lastUpdate').textContent = s.last_update || '--:--';
  const container = document.getElementById('catBars');
  if (!s.categories || s.categories.length === 0) { container.innerHTML = '<div class="empty">Nessun dato</div>'; return; }
  const max = s.categories[0].count;
  container.innerHTML = s.categories.slice(0, 7).map(c => `<div class="cat-row"><div class="cat-name">${c.name}</div><div class="cat-bar-wrap"><div class="cat-bar" style="width:${(c.count/max*100).toFixed(1)}%"></div></div><div class="cat-count">${c.count}</div></div>`).join('');
}
async function loadPriceChart() {
  const res = await fetch('/api/price-history');
  const data = await res.json();
  const ctx = document.getElementById('priceChart').getContext('2d');
  if (priceChart) priceChart.destroy();
  priceChart = new Chart(ctx, {
    type: 'line',
    data: { labels: data.map(d => d.time), datasets: [{ data: data.map(d => d.avg_price), borderColor: '#f0c040', backgroundColor: 'rgba(240,192,64,0.08)', borderWidth: 2, pointRadius: 3, pointBackgroundColor: '#f0c040', fill: true, tension: 0.4 }] },
    options: { responsive: true, plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => '€' + ctx.raw } } }, scales: { x: { grid: { color: '#1a1a24' }, ticks: { color: '#555570', font: { family: 'Space Mono', size: 10 } } }, y: { grid: { color: '#1a1a24' }, ticks: { color: '#555570', font: { family: 'Space Mono', size: 10 }, callback: v => '€' + v } } } }
  });
}
async function loadAuctions() {
  const res = await fetch('/api/auctions');
  const auctions = await res.json();
  const tbody = document.getElementById('auctionsTable');
  if (!auctions.length) { tbody.innerHTML = '<tr><td colspan="8" class="empty">Nessuna asta disponibile</td></tr>'; return; }
  tbody.innerHTML = auctions.map(a => {
    const savings = a.retail_price > 0 ? `<span class="savings-pct">−${(100 - a.current_price / a.retail_price * 100).toFixed(0)}%</span>` : '—';
    const status = a.is_live ? `<span class="status-live">LIVE</span>` : `<span class="status-timer">${a.time_left || '?'}</span>`;
    const link = a.url ? `<a href="${a.url}" target="_blank">→</a>` : '—';
    return `<tr><td class="title-cell">${a.title}</td><td><span class="cat-badge">${a.category}</span></td><td><span class="price-tag">€${a.current_price}</span></td><td style="color:#555570;font-family:'Space Mono',monospace;font-size:0.75rem">€${a.retail_price}</td><td>${savings}</td><td><span class="bids-count">${a.bids_count}</span></td><td>${status}</td><td>${link}</td></tr>`;
  }).join('');
}
async function loadAll() { await Promise.all([loadStats(), loadPriceChart(), loadAuctions()]); }
loadAll();
setInterval(loadAll, 60000);
</script>
</body>
</html>
